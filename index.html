<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>KTP Extreme Tour</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header id="topbar" class="topbar ktpTopbar" style="display:none;">
    <div class="ktpTopbar__nav">
      <div id="appTitle" class="brand__title">KTP Extreme Tour</div>
      <div class="ktpTabs" role="group" aria-label="Attraction type">
        <button id="coreTab" class="ktpTab" type="button">Core</button>
        <button id="bonusTab" class="ktpTab" type="button">Bonus</button>
      </div>
      <div class="topbar__right">
        <button id="moreBtn" class="iconBtn" type="button" aria-haspopup="menu" aria-expanded="false">More</button>
        <div id="moreMenu" class="menu" role="menu" aria-hidden="true">
          <button id="tweetUpdateMenuBtn" class="menu__item" type="button">Share an update</button>
          <button id="settingsMenuBtn" class="menu__item" type="button">Change tweet text</button>
          <button id="excludedRidesMenuBtn" class="menu__item" type="button">Excluded attractions</button>
          <button id="savedChallengesMenuBtn" class="menu__item" type="button">Saved Challenges</button>
          <button id="endToStartBtn" class="menu__item" type="button">End today’s challenge and return to Start</button>
        </div>
      </div>
    </div>
    <div id="statusLine" class="ktpTopbar__status" aria-live="polite">Total 0 (Core 0/10)</div>
  </header>

  <main id="app" class="app" role="main"></main>
  <div id="dialogHost"></div>
  <script type="module" src="./app.js"></script>
  <footer class="bottombar" aria-hidden="true"></footer>
</body>
</html>
